[tools]
python = "3.14"
uv = "latest"

[tasks.test]
description = "Unit tests on the current Python and on 3.9 (macOS system Python, which the Alfred workflow uses)"
run = ["uv run pytest -q", "uv run --isolated --python 3.9 --with pytest --with-editable . pytest -q"]

[tasks.alfred]
description = "Build dist/tablefix.alfredworkflow"
run = "python3 scripts/build_alfred.py"

[tasks."docs:validate"]
run = "uv run ~/.claude/skills/validate/scripts/okf_validate.py .okf --strict"

[tasks.check]
description = "Tests, workflow build and OKF validation"
depends = ["test", "alfred", "docs:validate"]

[tasks.release]
description = "Tag v<version> and publish a GitHub release with the Alfred workflow"
depends = ["check"]
run = '''
v=$(python3 -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("src/tablefix/__init__.py").read())[1])')
gh release create "v$v" dist/tablefix.alfredworkflow --title "v$v" --generate-notes
'''
