[tools]
go = "1.27.3"

[tasks.build]
description = "Build bin/pastefix"
run = "go build -o bin/pastefix ."

[tasks.test]
run = "go test -race ./..."

[tasks.vet]
run = "go vet ./... && GOOS=linux go vet ./..."

[tasks.fmt-check]
run = "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }"

[tasks."docs:validate"]
run = "uv run ~/.claude/skills/validate/scripts/okf_validate.py .okf --strict"

[tasks.check]
description = "gofmt, vet (macOS + Linux), race tests, OKF validation"
depends = ["fmt-check", "vet", "test", "docs:validate"]

[tasks.release]
description = "Tag v<version> and publish a GitHub release with macOS and Linux binaries"
depends = ["check"]
run = '''
set -e
v=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
rm -rf dist && mkdir dist
for p in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
  os=${p%/*}; arch=${p#*/}; d=dist/pastefix_${v}_${os}_${arch}
  mkdir "$d" && GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$d/pastefix" . && cp README.md LICENSE "$d/"
  tar -C dist -czf "$d.tar.gz" "$(basename "$d")" && rm -rf "$d"
done
(cd dist && shasum -a 256 *.tar.gz > checksums.txt)
gh release create "v$v" dist/*.tar.gz dist/checksums.txt --title "v$v" --generate-notes
'''

[tasks."test:clipboard"]
description = "Real clipboard round trip with no PATH and no LANG, as Alfred runs it (overwrites the clipboard)"
run = "PASTEFIX_CLIPBOARD_TEST=1 go test -run WithoutLocale -v ./..."
